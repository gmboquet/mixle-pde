[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixle-pde"
version = "0.8.0.dev0"
description = "PDE/ODE-constrained Bayesian inverse problems for mixle (a mixle.ppl plugin)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Grant Boquet", email = "grant.boquet@gmail.com" }]
keywords = ["pde", "inverse problems", "bayesian", "mixle"]
# Depends on mixle (the import package is `mixle`); the solvers are numpy/scipy. `pyproj` backs the
# CRS/projection layer (mixle_pde.geospatial) every real-world ingest card builds on.
dependencies = [
    "mixle",
    "numpy",
    "scipy",
    "pyproj",
]

[project.optional-dependencies]
# Dev tooling -- never required to import mixle_pde or to run the problem_adapter-boundary tests.
# joblib is included here (not just in the `parallel` extra below) so CI installs it by default and
# tests/mcmc_parallel_test.py actually runs for real; that file still self-skips via
# unittest.skipUnless when joblib is absent, for a base-plus-test-extras install that omits it.
test = ["pytest>=8", "pytest-xdist", "torch", "joblib"]
lint = ["ruff==0.15.17"]
docs = ["sphinx>=7", "furo"]

# Cross-repo reference-pipeline verification (tests/multiphysics_pipeline_integration_test.py):
# exercises the composite-heat scenario through mixle-physics (spec) -> mixle-sim (compilation)
# -> mixle-pde (execution, this repo) -> mixle-numerics (independent evidence verification).
# Depends on mixle-sim's own `integration` extra rather than re-declaring mixle-physics/
# mixle-numerics directly, so that extra is the one place the physics/numerics version pins live.
# Never required to import mixle_pde or to run any other test in this suite; a base install (zero
# extras) still passes the full suite minus this one file, which self-skips via
# `pytest.importorskip` when these siblings are absent.
integration = ["mixle-sim[integration]>=0.8.0.dev0"]

# Field-data ingest formats (workstream B): each is a single lazy-imported backend behind one
# `mixle_pde.io.*` (or `mixle_pde.env_data` / `mixle_pde.reductions`) module. `data` is the
# convenience bundle referenced by mixle_pde.io.assays/gis error messages.
raster = ["rasterio"]
netcdf = ["xarray", "netCDF4"]
grib = ["cfgrib", "xarray"]
segy = ["segyio"]
las = ["lasio"]
potfield = ["harmonica", "xarray"]
data = ["segyio", "lasio", "rasterio", "harmonica", "verde",
        "geopandas", "fiona", "pandas", "openpyxl"]

# MP-A5 batteries-included PDE profile -- capability-family extras. Every dependency here is
# already a lazy, guarded import inside the corresponding module (never imported at module scope),
# so a base install (zero extras) still imports mixle_pde and exercises every module whose forward
# path does not need the accelerator. Mapping follows mixle_pde.capabilities.capability_catalog()'s
# `required_dependencies` per capability plus the concrete lazy-import call sites:
#   - torch backs differentiable/adjoint forwards (mixle_pde.heat, .observations, .wave, .pde, ...)
#     and the surrogate/cascade path (mixle_pde.surrogate).
#   - pyamg/scikit-sparse (sksparse) are optional large-scale sparse-solve accelerators for FEM/mesh
#     assembled systems (mixle_pde.linear_solve, .uq_lowrank); mixle-pde falls back to SciPy's
#     incomplete-LU / dense Cholesky when they are absent, so they change performance, not
#     correctness or the public surface.
#   - scikit-learn backs the randomized-SVD low-rank UQ compression path (mixle_pde.uq_lowrank).
#   - mpi4py is forward-declared for the distributed mesh/solve transport described in the
#     architecture plan; no mixle_pde module imports it yet, so this extra currently installs a
#     dependency with no wired call site rather than unlocking new behavior.
#   - joblib backs mixle_pde.mcmc_parallel's opt-in multi-process chain dispatch (MP-I9). Chosen
#     over stdlib multiprocessing/concurrent.futures (docs/adr/0001-mp-a4-backend-selection.md's own
#     stated "zero extra dependency" preference for embarrassingly-parallel workloads) because this
#     repo's real ForwardOperator registrations (gravity/magnetics/borehole/... in
#     mixle_pde.observations) are built from closures that plain pickle cannot send to a spawned
#     worker process at all; joblib's loky backend serializes them via cloudpickle. Already an
#     indirect dependency the moment scikit-learn is (scikit-learn requires joblib), so this extra
#     mostly formalizes an existing transitive pin rather than adding a new one.
# `mixle_mlops` (the commercial task-cascade adapter mixle_pde.surrogate can optionally bind to) is
# deliberately never listed here or in `all`: it is an internal sibling package, not a public PyPI
# distribution, and per the architecture's commercial-adapter rule it must never be required to
# install or test mixle-pde.
fem = ["pyamg", "scikit-sparse"]
mesh = ["pyamg"]
mpi = ["mpi4py"]
fvm = ["torch", "pyamg"]
coupling = ["torch"]
inverse = ["torch", "scikit-learn", "pyamg", "scikit-sparse"]
surrogate = ["torch", "scikit-learn"]
parallel = ["joblib"]

# The union of the eight capability-family extras directly above -- the batteries-included PDE
# modeling profile the architecture plan names as its release/container deliverable (MP-L4), not a
# bundle of the separately-versioned geoscience data-format extras above (`raster`/`netcdf`/`grib`/
# `segy`/`las`/`potfield`/`data`), which a deployment opts into independently by data format.
all = ["pyamg", "scikit-sparse", "mpi4py", "torch", "scikit-learn", "joblib"]

[project.urls]
Homepage = "https://github.com/gmboquet/mixle-pde"
Repository = "https://github.com/gmboquet/mixle-pde"

[tool.setuptools.packages.find]
include = ["mixle_pde*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["*Test", "*TestCase"]
python_functions = ["test_*"]
addopts = "-ra -n auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "E731", "E402", "F841", "B008", "UP031", "B905", "B904", "B007"]
