[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixle-pde"
version = "0.1.0"
description = "PDE/ODE-constrained Bayesian inverse problems for mixle (a mixle.ppl plugin)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Grant Boquet", email = "grant.boquet@gmail.com" }]
keywords = ["pde", "inverse problems", "bayesian", "mixle"]
# Depends on mixle (the import package is `mixle`); the solvers are numpy/scipy.
dependencies = [
    "mixle",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist", "torch"]
lint = ["ruff==0.15.17"]
docs = ["sphinx>=7", "furo", "myst-parser>=2"]

[project.urls]
Homepage = "https://github.com/gmboquet/mixle-pde"
Repository = "https://github.com/gmboquet/mixle-pde"

[tool.setuptools.packages.find]
include = ["mixle_pde*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["*Test", "*TestCase"]
python_functions = ["test_*"]
addopts = "-ra -n auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "E731", "E402", "F841", "B008", "UP031", "B905", "B904", "B007"]
