name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.17
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # torch is used by the differentiable `ops` backend; install the CPU wheel explicitly.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # mixle is the sibling package this plugin extends; it is not yet on PyPI.
      # If gmboquet/mixle is private, add a MIXLE_TOKEN secret and prefix the URL with
      # x-access-token:${{ secrets.MIXLE_TOKEN }}@ before github.com.
      - name: Install mixle (core dependency)
        run: pip install "mixle @ git+https://github.com/gmboquet/mixle.git@main"
      - name: Install mixle-pde
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest
